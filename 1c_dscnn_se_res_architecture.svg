<svg width="100%" viewBox="0 0 680 1820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Seabird_DSCNN_SE_Res Architecture Diagram</title>
  <desc>Vertical flowchart of the DSCNN-SE model: input → initial conv block → 4 DS-Conv+SE blocks with pooling and dropout → global average pooling → dense head → output</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; fill: #555; }
      .arr { stroke: #888; stroke-width: 1.5; fill: none; }

      /* Blue */
      .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th    { fill: #0C447C; }
      .c-blue .ts    { fill: #185FA5; }

      /* Teal */
      .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th    { fill: #085041; }
      .c-teal .ts    { fill: #0F6E56; }

      /* Coral */
      .c-coral rect  { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th   { fill: #712B13; }
      .c-coral .ts   { fill: #993C1D; }

      /* Purple */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      /* Green */
      .c-green rect  { fill: #EAF3DE; stroke: #3B6D11; }
      .c-green .th   { fill: #27500A; }
      .c-green .ts   { fill: #3B6D11; }

      /* Gray */
      .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th    { fill: #444441; }
      .c-gray .ts    { fill: #5F5E5A; }

      /* Legend swatches */
      .swatch-blue   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
      .swatch-teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
      .swatch-coral  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
      .swatch-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
      .swatch-green  { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- ── INPUT ── -->
  <g class="c-gray">
    <rect x="230" y="20" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Input</text>
  </g>
  <text class="ts" x="460" y="42" dominant-baseline="central">(None, 64, 300, 1)</text>
  <line x1="340" y1="64" x2="340" y2="90" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── INITIAL CONV BLOCK ── -->
  <g class="c-blue">
    <rect x="200" y="90" width="280" height="100" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">Initial conv block</text>
    <text class="ts" x="340" y="140" text-anchor="middle" dominant-baseline="central">Conv2D → BN → ReLU</text>
    <text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">(None, 64, 300, 64) · 576 params</text>
  </g>
  <line x1="340" y1="190" x2="340" y2="216" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── BLOCK 1 ── -->
  <rect x="160" y="216" width="360" height="248" rx="10" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">Block 1 — DS-Conv + SE</text>

  <g class="c-teal">
    <rect x="200" y="224" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">DepthwiseConv2D → BN → ReLU</text>
    <text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">(None, 64, 300, 64) · 576 params</text>
  </g>
  <line x1="340" y1="280" x2="340" y2="300" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-teal">
    <rect x="200" y="300" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="324" text-anchor="middle" dominant-baseline="central">Pointwise Conv2D → BN</text>
    <text class="ts" x="340" y="344" text-anchor="middle" dominant-baseline="central">(None, 64, 300, 64) · 4,096 params</text>
  </g>
  <line x1="340" y1="356" x2="340" y2="376" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-coral">
    <rect x="200" y="376" width="280" height="68" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="398" text-anchor="middle" dominant-baseline="central">SE: GAP → Dense(16) → Dense(64)</text>
    <text class="ts" x="340" y="418" text-anchor="middle" dominant-baseline="central">Squeeze &amp; excite · scale · ReLU</text>
    <text class="ts" x="340" y="436" text-anchor="middle" dominant-baseline="central">2,128 params</text>
  </g>
  <line x1="340" y1="444" x2="340" y2="464" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-gray">
    <rect x="200" y="464" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="486" text-anchor="middle" dominant-baseline="central">MaxPool2D → Dropout</text>
  </g>
  <text class="ts" x="490" y="486" dominant-baseline="central">(None, 32, 150, 64)</text>
  <line x1="340" y1="508" x2="340" y2="534" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── BLOCK 2 ── -->
  <rect x="160" y="534" width="360" height="248" rx="10" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">Block 2 — DS-Conv + SE</text>

  <g class="c-teal">
    <rect x="200" y="542" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="566" text-anchor="middle" dominant-baseline="central">DepthwiseConv2D → BN → ReLU</text>
    <text class="ts" x="340" y="586" text-anchor="middle" dominant-baseline="central">(None, 32, 150, 64) · 576 params</text>
  </g>
  <line x1="340" y1="598" x2="340" y2="618" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-teal">
    <rect x="200" y="618" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="642" text-anchor="middle" dominant-baseline="central">Pointwise Conv2D → BN</text>
    <text class="ts" x="340" y="662" text-anchor="middle" dominant-baseline="central">(None, 32, 150, 128) · 8,192 params</text>
  </g>
  <line x1="340" y1="674" x2="340" y2="694" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-coral">
    <rect x="200" y="694" width="280" height="68" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="716" text-anchor="middle" dominant-baseline="central">SE: GAP → Dense(16) → Dense(128)</text>
    <text class="ts" x="340" y="736" text-anchor="middle" dominant-baseline="central">Squeeze &amp; excite · scale · ReLU</text>
    <text class="ts" x="340" y="754" text-anchor="middle" dominant-baseline="central">4,240 params</text>
  </g>
  <line x1="340" y1="762" x2="340" y2="782" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-gray">
    <rect x="200" y="782" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="804" text-anchor="middle" dominant-baseline="central">MaxPool2D → Dropout</text>
  </g>
  <text class="ts" x="490" y="804" dominant-baseline="central">(None, 16, 75, 128)</text>
  <line x1="340" y1="826" x2="340" y2="852" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── BLOCK 3 ── -->
  <rect x="160" y="852" width="360" height="248" rx="10" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="ts" x="340" y="846" text-anchor="middle" dominant-baseline="central">Block 3 — DS-Conv + SE</text>

  <g class="c-teal">
    <rect x="200" y="860" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="884" text-anchor="middle" dominant-baseline="central">DepthwiseConv2D → BN → ReLU</text>
    <text class="ts" x="340" y="904" text-anchor="middle" dominant-baseline="central">(None, 16, 75, 128) · 1,152 params</text>
  </g>
  <line x1="340" y1="916" x2="340" y2="936" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-teal">
    <rect x="200" y="936" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="960" text-anchor="middle" dominant-baseline="central">Pointwise Conv2D → BN</text>
    <text class="ts" x="340" y="980" text-anchor="middle" dominant-baseline="central">(None, 16, 75, 256) · 32,768 params</text>
  </g>
  <line x1="340" y1="992" x2="340" y2="1012" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-coral">
    <rect x="200" y="1012" width="280" height="68" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1034" text-anchor="middle" dominant-baseline="central">SE: GAP → Dense(16) → Dense(256)</text>
    <text class="ts" x="340" y="1054" text-anchor="middle" dominant-baseline="central">Squeeze &amp; excite · scale · ReLU</text>
    <text class="ts" x="340" y="1072" text-anchor="middle" dominant-baseline="central">8,464 params</text>
  </g>
  <line x1="340" y1="1080" x2="340" y2="1100" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-gray">
    <rect x="200" y="1100" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1122" text-anchor="middle" dominant-baseline="central">MaxPool2D → Dropout</text>
  </g>
  <text class="ts" x="490" y="1122" dominant-baseline="central">(None, 8, 37, 256)</text>
  <line x1="340" y1="1144" x2="340" y2="1170" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── BLOCK 4 ── -->
  <rect x="160" y="1170" width="360" height="248" rx="10" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="ts" x="340" y="1164" text-anchor="middle" dominant-baseline="central">Block 4 — DS-Conv + SE</text>

  <g class="c-teal">
    <rect x="200" y="1178" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1202" text-anchor="middle" dominant-baseline="central">DepthwiseConv2D → BN → ReLU</text>
    <text class="ts" x="340" y="1222" text-anchor="middle" dominant-baseline="central">(None, 8, 37, 256) · 2,304 params</text>
  </g>
  <line x1="340" y1="1234" x2="340" y2="1254" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-teal">
    <rect x="200" y="1254" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1278" text-anchor="middle" dominant-baseline="central">Pointwise Conv2D → BN</text>
    <text class="ts" x="340" y="1298" text-anchor="middle" dominant-baseline="central">(None, 8, 37, 512) · 131,072 params</text>
  </g>
  <line x1="340" y1="1310" x2="340" y2="1330" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-coral">
    <rect x="200" y="1330" width="280" height="68" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1352" text-anchor="middle" dominant-baseline="central">SE: GAP → Dense(32) → Dense(512)</text>
    <text class="ts" x="340" y="1372" text-anchor="middle" dominant-baseline="central">Squeeze &amp; excite · scale · ReLU</text>
    <text class="ts" x="340" y="1390" text-anchor="middle" dominant-baseline="central">33,312 params</text>
  </g>
  <line x1="340" y1="1398" x2="340" y2="1418" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <g class="c-gray">
    <rect x="200" y="1418" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1440" text-anchor="middle" dominant-baseline="central">MaxPool2D → Dropout</text>
  </g>
  <text class="ts" x="490" y="1440" dominant-baseline="central">(None, 4, 18, 512)</text>
  <line x1="340" y1="1462" x2="340" y2="1488" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── GLOBAL POOL ── -->
  <g class="c-purple">
    <rect x="200" y="1488" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1510" text-anchor="middle" dominant-baseline="central">Global Average Pooling</text>
  </g>
  <text class="ts" x="490" y="1510" dominant-baseline="central">(None, 512)</text>
  <line x1="340" y1="1532" x2="340" y2="1558" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── FC HEAD ── -->
  <g class="c-blue">
    <rect x="200" y="1558" width="280" height="100" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1584" text-anchor="middle" dominant-baseline="central">Dense(128) → BN → ReLU</text>
    <text class="ts" x="340" y="1606" text-anchor="middle" dominant-baseline="central">65,664 params</text>
    <text class="ts" x="340" y="1626" text-anchor="middle" dominant-baseline="central">Dropout</text>
    <text class="ts" x="340" y="1645" text-anchor="middle" dominant-baseline="central">(None, 128)</text>
  </g>
  <line x1="340" y1="1658" x2="340" y2="1684" class="arr" marker-end="url(#arrow)" stroke="#888"/>

  <!-- ── OUTPUT ── -->
  <g class="c-green">
    <rect x="230" y="1684" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1706" text-anchor="middle" dominant-baseline="central">Output — Dense(12)</text>
    <text class="ts" x="340" y="1726" text-anchor="middle" dominant-baseline="central">(None, 12) · 1,548 params</text>
  </g>

  <!-- ── LEGEND ── -->
  <rect x="40"  y="1760" width="12" height="12" rx="2" class="swatch-blue"/>
  <text class="ts" x="58"  y="1771" dominant-baseline="central" style="fill:#1a1a1a">Conv block</text>
  <rect x="160" y="1760" width="12" height="12" rx="2" class="swatch-teal"/>
  <text class="ts" x="178" y="1771" dominant-baseline="central" style="fill:#1a1a1a">DS-Conv</text>
  <rect x="270" y="1760" width="12" height="12" rx="2" class="swatch-coral"/>
  <text class="ts" x="288" y="1771" dominant-baseline="central" style="fill:#1a1a1a">SE block</text>
  <rect x="370" y="1760" width="12" height="12" rx="2" class="swatch-purple"/>
  <text class="ts" x="388" y="1771" dominant-baseline="central" style="fill:#1a1a1a">Pooling</text>
  <rect x="460" y="1760" width="12" height="12" rx="2" class="swatch-green"/>
  <text class="ts" x="478" y="1771" dominant-baseline="central" style="fill:#1a1a1a">Output</text>
</svg>
