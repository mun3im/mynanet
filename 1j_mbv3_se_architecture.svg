<svg width="100%" viewBox="0 0 920 1060" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>MynaNet 1j — MBV3-SE Architecture</title>
  <desc>Vertical pipeline of Model 1j (MBV3-SE): mel input → stem conv → 4 InvRes-SE blocks with MaxPool → last expansion conv → GAP → dense head → 12-class output. Right panel shows expanded InvRes-SE block internals with MBV2/MBV3 source annotations.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; fill: #1a1a1a; }
      .th  { font-size: 13px; font-weight: 700; }
      .ts  { font-size: 11px; }
      .dim { font-size: 10px; fill: #888; font-style: italic; }
      .lbl { font-size: 9.5px; fill: #666; font-style: italic; }
      .sec { font-size: 14px; font-weight: 700; fill: #333; }
      .arr { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arr); }

      .c-gray   rect { fill: #F5F5F5; stroke: #9E9E9E; stroke-width: 1.5; }
      .c-gray   .th  { fill: #212121; }
      .c-gray   .ts  { fill: #616161; }

      .c-blue   rect { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.5; }
      .c-blue   .th  { fill: #0D47A1; }
      .c-blue   .ts  { fill: #1565C0; }

      .c-teal   rect { fill: #E0F2F1; stroke: #00695C; stroke-width: 1.5; }
      .c-teal   .th  { fill: #004D40; }
      .c-teal   .ts  { fill: #00695C; }

      .c-orange rect { fill: #FFF3E0; stroke: #E65100; stroke-width: 1.5; }
      .c-orange .th  { fill: #BF360C; }
      .c-orange .ts  { fill: #E65100; }

      .c-coral  rect { fill: #FBE9E7; stroke: #C62828; stroke-width: 1.5; }
      .c-coral  .th  { fill: #7F0000; }
      .c-coral  .ts  { fill: #C62828; }

      .c-purple rect { fill: #EDE7F6; stroke: #4527A0; stroke-width: 1.5; }
      .c-purple .th  { fill: #311B92; }
      .c-purple .ts  { fill: #4527A0; }

      .c-green  rect { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; }
      .c-green  .th  { fill: #1B5E20; }
      .c-green  .ts  { fill: #388E3C; }
    </style>
  </defs>

  <!-- ── Title ── -->
  <text x="460" y="26" text-anchor="middle" class="sec">
    MynaNet · Model 1j · MBV3-SE · 267 KB INT8 · 94.91% INT8 accuracy (Linux/CUDA, 3-seed mean)
  </text>

  <!-- ════════════════════════════════════════════════
       LEFT PANEL — Main Pipeline  (x: 50–390)
       ════════════════════════════════════════════════ -->

  <text x="220" y="48" text-anchor="middle" class="sec" font-size="12">Model Pipeline</text>

  <!-- INPUT -->
  <g class="c-gray" transform="translate(50,56)">
    <rect width="340" height="44" rx="6"/>
    <text x="170" y="18" text-anchor="middle" class="th">Input · Mel Spectrogram</text>
    <text x="170" y="33" text-anchor="middle" class="ts">64 × 300 × 1  ·  globally normalised [0, 1]</text>
  </g>
  <line x1="220" y1="100" x2="220" y2="118" class="arr"/>

  <!-- STEM -->
  <g class="c-blue" transform="translate(50,118)">
    <rect width="340" height="62" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Stem Conv</text>
    <text x="170" y="35" text-anchor="middle" class="ts">Conv2D 3×3 / 32 ch · BN · ReLU6</text>
    <text x="170" y="51" text-anchor="middle" class="dim">out: 64 × 300 × 32</text>
  </g>
  <line x1="220" y1="180" x2="220" y2="200" class="arr"/>

  <!-- BLOCK 1 -->
  <g class="c-teal" transform="translate(50,200)">
    <rect width="340" height="78" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Block 1 · InvRes-SE</text>
    <text x="170" y="36" text-anchor="middle" class="ts">t=1 · 32→16 ch · DW 3×3 · SE r=4</text>
    <text x="170" y="52" text-anchor="middle" class="ts">MaxPool 2×2 · Dropout 0.025</text>
    <text x="170" y="68" text-anchor="middle" class="dim">out: 32 × 150 × 16</text>
  </g>
  <!-- connector to right panel -->
  <line x1="390" y1="239" x2="448" y2="239" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="220" y1="278" x2="220" y2="298" class="arr"/>

  <!-- BLOCK 2 -->
  <g class="c-teal" transform="translate(50,298)">
    <rect width="340" height="78" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Block 2 · InvRes-SE</text>
    <text x="170" y="36" text-anchor="middle" class="ts">t=6 · 16→24 ch · DW 3×3 · SE r=8</text>
    <text x="170" y="52" text-anchor="middle" class="ts">MaxPool 2×2 · Dropout 0.025</text>
    <text x="170" y="68" text-anchor="middle" class="dim">out: 16 × 75 × 24</text>
  </g>
  <line x1="220" y1="376" x2="220" y2="396" class="arr"/>

  <!-- BLOCK 3 (MBV3 5×5) -->
  <g class="c-orange" transform="translate(50,396)">
    <rect width="340" height="78" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Block 3 · InvRes-SE  ★</text>
    <text x="170" y="36" text-anchor="middle" class="ts">t=6 · 24→48 ch · DW 5×5 · SE r=16</text>
    <text x="170" y="52" text-anchor="middle" class="ts">MaxPool 2×2 · Dropout 0.0375</text>
    <text x="170" y="68" text-anchor="middle" class="dim">out: 8 × 37 × 48   ★ 5×5 DW from MBV3</text>
  </g>
  <line x1="220" y1="474" x2="220" y2="494" class="arr"/>

  <!-- BLOCK 4 (MBV3 5×5) -->
  <g class="c-orange" transform="translate(50,494)">
    <rect width="340" height="78" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Block 4 · InvRes-SE  ★</text>
    <text x="170" y="36" text-anchor="middle" class="ts">t=6 · 48→96 ch · DW 5×5 · SE r=16</text>
    <text x="170" y="52" text-anchor="middle" class="ts">MaxPool 2×2 · Dropout 0.05</text>
    <text x="170" y="68" text-anchor="middle" class="dim">out: 4 × 18 × 96   ★ 5×5 DW from MBV3</text>
  </g>
  <line x1="220" y1="572" x2="220" y2="592" class="arr"/>

  <!-- LAST CONV -->
  <g class="c-blue" transform="translate(50,592)">
    <rect width="340" height="62" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Last Expansion Conv</text>
    <text x="170" y="35" text-anchor="middle" class="ts">Conv2D 1×1 / 320 ch · BN · ReLU6</text>
    <text x="170" y="51" text-anchor="middle" class="dim">out: 4 × 18 × 320</text>
  </g>
  <line x1="220" y1="654" x2="220" y2="674" class="arr"/>

  <!-- GAP -->
  <g class="c-teal" transform="translate(50,674)">
    <rect width="340" height="46" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">GlobalAveragePooling2D</text>
    <text x="170" y="35" text-anchor="middle" class="dim">out: 320</text>
  </g>
  <line x1="220" y1="720" x2="220" y2="740" class="arr"/>

  <!-- HEAD -->
  <g class="c-purple" transform="translate(50,740)">
    <rect width="340" height="62" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Classification Head</text>
    <text x="170" y="35" text-anchor="middle" class="ts">Dense 128 · BN · ReLU6 · Dropout 0.05</text>
    <text x="170" y="51" text-anchor="middle" class="dim">out: 128</text>
  </g>
  <line x1="220" y1="802" x2="220" y2="822" class="arr"/>

  <!-- OUTPUT DENSE -->
  <g class="c-purple" transform="translate(50,822)">
    <rect width="340" height="46" rx="6"/>
    <text x="170" y="19" text-anchor="middle" class="th">Dense 12 · Softmax</text>
    <text x="170" y="35" text-anchor="middle" class="dim">out: 12</text>
  </g>
  <line x1="220" y1="868" x2="220" y2="888" class="arr"/>

  <!-- OUTPUT -->
  <g class="c-gray" transform="translate(50,888)">
    <rect width="340" height="44" rx="6"/>
    <text x="170" y="18" text-anchor="middle" class="th">Output · 12 Bird Classes</text>
    <text x="170" y="34" text-anchor="middle" class="ts">argmax → species label</text>
  </g>

  <!-- ════════════════════════════════════════════════
       RIGHT PANEL — InvRes-SE Block Detail  (x: 448–910)
       ════════════════════════════════════════════════ -->

  <rect x="448" y="44" width="464" height="740" rx="8"
        fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>

  <text x="680" y="67" text-anchor="middle" class="sec" font-size="12">InvRes-SE Block — Expanded</text>
  <text x="680" y="82" text-anchor="middle" class="lbl">
    applies to all 4 blocks · ★ = MBV3 ops in blocks 3–4
  </text>

  <!-- Input arrow into detail -->
  <line x1="680" y1="90" x2="680" y2="110" class="arr"/>

  <!-- Shortcut rail (dashed, right side) -->
  <!-- Branches from y=100, runs right to x=895, down to Add box center y=620, back left -->
  <path d="M 680 100 H 900 V 623 H 862"
        stroke="#BBB" stroke-width="1.5" stroke-dasharray="5,3"
        fill="none" marker-end="url(#arr)"/>
  <text x="903" y="362" text-anchor="start" class="lbl"
        transform="rotate(90,903,362)">shortcut (if in_ch == out_ch)</text>

  <!-- PW EXPAND -->
  <g class="c-blue" transform="translate(464,110)">
    <rect width="390" height="56" rx="5"/>
    <text x="195" y="19" text-anchor="middle" class="th">Pointwise Expand · Conv2D 1×1</text>
    <text x="195" y="35" text-anchor="middle" class="ts">in_ch × t channels · BN · ReLU6</text>
    <text x="195" y="50" text-anchor="middle" class="dim">e.g. Block 2: 16 × 6 = 96 ch expanded</text>
  </g>
  <text x="858" y="142" text-anchor="end" class="lbl" fill="#1565C0">← MBV2</text>
  <line x1="680" y1="166" x2="680" y2="188" class="arr"/>

  <!-- DW CONV -->
  <g class="c-teal" transform="translate(464,188)">
    <rect width="390" height="68" rx="5"/>
    <text x="195" y="19" text-anchor="middle" class="th">Depthwise Conv · k×k · BN · ReLU6</text>
    <text x="195" y="36" text-anchor="middle" class="ts">Blocks 1–2: k = 3×3</text>
    <text x="195" y="52" text-anchor="middle" class="ts" fill="#BF360C">Blocks 3–4: k = 5×5  ★  (wider spectral/temporal receptive field)</text>
    <text x="195" y="64" text-anchor="middle" class="dim">spatial filtering, one filter per channel</text>
  </g>
  <text x="858" y="218" text-anchor="end" class="lbl" fill="#00695C">3×3 ← MBV1/2</text>
  <text x="858" y="232" text-anchor="end" class="lbl" fill="#E65100">5×5 ← MBV3 ★</text>
  <line x1="680" y1="256" x2="680" y2="278" class="arr"/>

  <!-- SE BLOCK -->
  <g class="c-coral" transform="translate(464,278)">
    <rect width="390" height="120" rx="5"/>
    <text x="195" y="19" text-anchor="middle" class="th">Squeeze-and-Excitation (SE)</text>
    <text x="195" y="38" text-anchor="middle" class="ts">GAP  →  FC(exp/r, ReLU)  →  FC(exp)</text>
    <text x="195" y="56" text-anchor="middle" class="ts">→  HardSigmoid  →  Scale (channel-wise ×)</text>
    <!-- hard sigmoid highlight -->
    <rect x="60" y="65" width="270" height="24" rx="4" fill="#FFEBEE" stroke="#E53935" stroke-width="1"/>
    <text x="195" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">
      HardSig(x) = relu6(x + 3) / 6
    </text>
    <text x="195" y="100" text-anchor="middle" class="dim">no exp() · piecewise linear · all TFLite Micro ops</text>
    <text x="195" y="114" text-anchor="middle" class="dim">recalibrates each channel independently</text>
  </g>
  <text x="858" y="308" text-anchor="end" class="lbl" fill="#C62828">SE idea ← SENet</text>
  <text x="858" y="322" text-anchor="end" class="lbl" fill="#E65100">hard-sigmoid ← MBV3</text>
  <line x1="680" y1="398" x2="680" y2="418" class="arr"/>

  <!-- PW PROJECT -->
  <g class="c-blue" transform="translate(464,418)">
    <rect width="390" height="56" rx="5"/>
    <text x="195" y="19" text-anchor="middle" class="th">Pointwise Project · Conv2D 1×1</text>
    <text x="195" y="35" text-anchor="middle" class="ts">→ out_ch · BN · no activation</text>
    <text x="195" y="50" text-anchor="middle" class="dim">linear bottleneck preserves information gradient flow</text>
  </g>
  <text x="858" y="450" text-anchor="end" class="lbl" fill="#1565C0">← MBV2</text>
  <line x1="680" y1="474" x2="680" y2="494" class="arr"/>

  <!-- ADD -->
  <g class="c-gray" transform="translate(464,494)">
    <rect width="390" height="46" rx="5"/>
    <text x="195" y="18" text-anchor="middle" class="th">Add ⊕  (Residual connection)</text>
    <text x="195" y="34" text-anchor="middle" class="ts">applied only when in_ch == out_ch  and  stride == 1</text>
  </g>
  <text x="858" y="522" text-anchor="end" class="lbl" fill="#1565C0">← MBV2</text>
  <line x1="680" y1="540" x2="680" y2="560" class="arr"/>

  <text x="680" y="578" text-anchor="middle" class="ts" fill="#555">→ MaxPool 2×2  ·  Dropout  →  next block</text>

  <!-- ── Legend ── -->
  <rect x="448" y="600" width="464" height="180" rx="8"
        fill="#F9F9F9" stroke="#DDD" stroke-width="1"/>
  <text x="680" y="620" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Algorithm Origins</text>

  <!-- Col 1 -->
  <rect x="462" y="630" width="14" height="12" rx="2" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="482" y="641" class="lbl" fill="#333">Pointwise Conv 1×1, expand/project, linear bottleneck  ←  MobileNetV2</text>

  <rect x="462" y="650" width="14" height="12" rx="2" fill="#E0F2F1" stroke="#00695C" stroke-width="1.5"/>
  <text x="482" y="661" class="lbl" fill="#333">Depthwise Conv 3×3  ←  MobileNetV1 / MobileNetV2</text>

  <rect x="462" y="670" width="14" height="12" rx="2" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="482" y="681" class="lbl" fill="#333">Depthwise Conv 5×5 · hard-sigmoid SE  ←  MobileNetV3  ★</text>

  <rect x="462" y="690" width="14" height="12" rx="2" fill="#FBE9E7" stroke="#C62828" stroke-width="1.5"/>
  <text x="482" y="701" class="lbl" fill="#333">Squeeze-and-Excitation (channel attention)  ←  SENet (Hu et al., 2018)</text>

  <rect x="462" y="710" width="14" height="12" rx="2" fill="#EDE7F6" stroke="#4527A0" stroke-width="1.5"/>
  <text x="482" y="721" class="lbl" fill="#333">Classification head  ←  custom  (Dense 128 + BN + Dropout)</text>

  <!-- shortcut legend -->
  <line x1="462" y1="736" x2="476" y2="736" stroke="#BBB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="482" y="741" class="lbl" fill="#333">Residual shortcut  ←  MobileNetV2 / ResNet</text>

  <text x="680" y="760" text-anchor="middle" class="lbl">
    Channel sequence: 32 → 16 → 24 → 48 → 96 → 320  ·  All ops H7-compatible (no BATCH_MATMUL, no FLEX)
  </text>
  <text x="680" y="775" text-anchor="middle" class="lbl">
    Network topology, channel widths, block config and head are custom — not a pruned MobileNet
  </text>

  <!-- ── Stat bar ── -->
  <g class="c-green" transform="translate(448,800)">
    <rect width="464" height="52" rx="8"/>
    <text x="232" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E20">
      94.91% INT8  ·  267.1 KB  ·  Best H7-deployable in Series 1
    </text>
    <text x="232" y="38" text-anchor="middle" font-size="10" fill="#388E3C">
      beats pretrained EfficientNetB0 INT8 (91.58%) at 19× smaller model size
    </text>
  </g>

</svg>
